name: Release plugin

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Check release version
        id: metadata
        env:
          RELEASE_REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys
          sys.path.insert(0, 'scripts')
          from submit_database import channel, release_url, validate_registration_manifest
          manifest = json.loads(pathlib.Path('manifest.json').read_text())
          validate_registration_manifest(manifest)
          tag = 'v' + manifest['version']
          if os.environ['RELEASE_REF'] != 'refs/tags/' + tag:
              raise SystemExit('Run this workflow on the tag matching manifest.version: ' + tag)
          release_url(manifest, os.environ['REPOSITORY'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('tag=' + tag + '\n')
              output.write('prerelease=' + str(channel(manifest['version']) == 'testing').lower() + '\n')
          pathlib.Path('release-notes.md').write_text(manifest['changelog'] + '\n')
          PY
      # the shipped panel must stay stdlib-only Python and valid systemd units
      - name: Check the vendored fan panel
        run: |
          python3 -m py_compile src/backend.py
          python3 -m py_compile vendor/framely-sdk/python/framely.py
          test -s icon.png
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check and test
        run: |
          npm run typecheck
          npm test
      - name: Build and package
        run: |
          python3 scripts/icon.py
          npm run build
          python3 scripts/pack.py
          cd dist
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/*.framely
            dist/SHA256SUMS
            release-notes.md
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          args=()
          if [[ "$PRERELEASE" == true ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/*.framely dist/SHA256SUMS \
            --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md "${args[@]}"
